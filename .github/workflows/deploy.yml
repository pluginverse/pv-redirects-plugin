name: GitHub release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - run: npm ci --no-audit --no-fund
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer phpstan
      - run: npm run lint
      - run: npm run build
      - run: git diff --exit-code -- build/
      - run: npm run test:package
      - run: composer env:start
      - run: composer test
      - if: always()
        run: composer env:stop
      - run: python3 scripts/package.py --tag "$GITHUB_REF_NAME"
      - run: python3 scripts/package.py --tag "$GITHUB_REF_NAME" --verify dist/pv-redirects.zip
      - name: Extract release archive for Plugin Check
        run: unzip -q dist/pv-redirects.zip -d dist/plugin-check
      - name: Check packaged plugin
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: ./dist/plugin-check/pv-redirects
      - name: Extract release notes
        run: python3 scripts/release.py notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: dist/pv-redirects.zip
          fail_on_unmatched_files: true
