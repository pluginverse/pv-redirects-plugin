name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build admin
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Prepare for production
        run: |
          rm .gitignore
          mv .deploy.gitignore .gitignore
          rm -rf .github
          rm -rf .idea
          rm -rf .vscode
          rm -rf admin-src
          rm -rf docs
          rm -rf node_modules
          rm -rf tests
          rm -f AGENTS.md CLAUDE.md
          rm -f composer.lock package-lock.json
          rm -f phpunit.xml.dist phpstan.neon phpstan.extension.neon

      - name: Create a built branch
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}-built"
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action"
          git remote set-url origin "https://$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git"
          git checkout -b "$BRANCH_NAME"
          git add -A && git commit -m "built from $GITHUB_SHA"
          git push --force -u origin "$BRANCH_NAME"
