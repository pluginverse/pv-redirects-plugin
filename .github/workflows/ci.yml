name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: npm ci --no-audit --no-fund
      - run: composer install --no-interaction --prefer-dist
      - run: composer env:start
      - run: composer test
      - if: always()
        run: composer env:stop
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - run: npm ci --no-audit --no-fund
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer phpstan
      - run: npm run lint
      - run: npm run build
      - run: git diff --exit-code -- build/
      - run: npm run test:package
      - run: npm run package
      - name: Extract release archive for Plugin Check
        run: unzip -q dist/pv-redirects.zip -d dist/plugin-check
      - name: Check packaged plugin
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: ./dist/plugin-check/pv-redirects
